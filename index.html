<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoPong</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #222; font-family: sans-serif; color: white; touch-action: none; }
        #oyunEkrani { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; cursor: crosshair; }

        #uiKatmani { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #uiKatmani > * { pointer-events: auto; }
        #menu { background: rgba(30, 30, 30, 0.9); padding: 40px; border-radius: 10px; text-align: center; border: 2px solid #555; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        #btnResmi { background-color: #3498db; color: white; }
        #btnP2P { background-color: #2ecc71; color: white; }
        input[type="text"], input[type="number"], select { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; border: none; text-align: center; }
        
        #kontrolPaneli { display: none; position: absolute; bottom: 20px; max-width: 1000px; padding: 15px; background-color: rgba(30, 30, 30, 0.85); border-radius: 8px; border: 1px solid #555; text-align: center; z-index: 50; }
        #btnKirmizi { background-color: #e74c3c; color: white; }
        #btnIzleyici { background-color: #7f8c8d; color: white; }
        #btnMavi { background-color: #3498db; color: white; }

        #sagUstKisim { position: absolute; top: 20px; right: 20px; z-index: 50; display: none; flex-direction: column; align-items: flex-end; }
        #ustButonlar { margin-bottom: 10px; display: flex; gap: 10px; }
        #btnAyarlarAc { background-color: #f39c12; color: white; display: none; margin: 0; padding: 8px 15px; font-size: 14px; }
        #btnMacBitir { background-color: #8e44ad; color: white; display: none; margin: 0; padding: 8px 15px; font-size: 14px; }
        #btnOdadanCik { background-color: #e67e22; color: white; margin: 0; padding: 8px 15px; font-size: 14px; }

        /* TAKIM LİSTELERİ */
        .takim-listesi { position: absolute; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #555; min-width: 150px; display: none; z-index: 50; }
        .takim-listesi h3 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 5px; text-align: center; }
        .takim-listesi ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: white; }
        .takim-listesi li { margin-bottom: 8px; padding-left: 5px; text-shadow: 1px 1px 2px black; }
        
        #takimMaviListe { left: 20px; top: 20px; border-color: #3498db; }
        #takimKirmiziListe { right: 20px; top: 70px; border-color: #e74c3c; } 
        #takimIzleyiciListe { right: 20px; top: 200px; border-color: #7f8c8d; }

        #chatAlani { position: absolute; bottom: 20px; left: 20px; width: 320px; max-height: 250px; display: none; flex-direction: column; z-index: 60; pointer-events: auto; }
        #mesajGecmisi { flex-grow: 1; background: rgba(0, 0, 0, 0.5); border-radius: 8px 8px 0 0; padding: 10px; overflow-y: auto; color: white; font-size: 14px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
        #mesajGecmisi li { text-shadow: 1px 1px 2px black; word-wrap: break-word; }
        #chatInput { width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, 0.7); border: 1px solid #555; border-radius: 0 0 8px 8px; color: white; padding: 8px; font-size: 14px; outline: none; margin: 0; }
        #chatInput:focus { border-color: #f1c40f; }

        #mobilKontroller { display: none; position: absolute; bottom: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; pointer-events: none; }
        #joystickAlan { position: absolute; bottom: 100px; left: 40px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        #joystickTop { position: absolute; top: 35px; left: 35px; width: 70px; height: 70px; background: rgba(255,255,255,0.6); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        #btnMobilSut { position: absolute; bottom: 100px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: rgba(231, 76, 60, 0.6); border: 2px solid rgba(231, 76, 60, 0.8); color: white; font-weight: bold; font-size: 18px; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #btnMobilSprint { position: absolute; bottom: 190px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: rgba(46, 204, 113, 0.6); border: 2px solid rgba(46, 204, 113, 0.8); color: white; font-weight: bold; font-size: 16px; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #btnMobilIttir { position: absolute; bottom: 145px; right: 110px; width: 60px; height: 60px; border-radius: 50%; background: rgba(52, 152, 219, 0.6); border: 2px solid rgba(52, 152, 219, 0.8); color: white; font-weight: bold; font-size: 14px; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }

        /* YENİ: GELİŞMİŞ AYARLAR MODALI */
        #gelismisAyarlarModal { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(20,20,20,0.95); padding:20px; border:2px solid #f39c12; border-radius:10px; z-index:200; color:white; width: 340px; box-shadow: 0 0 25px black; pointer-events: auto; }
        .ayar-grid { display:grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .ayar-grid input { padding: 4px; font-size: 14px; width: 100%; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; }
    </style>
</head>
<body>
    
    <canvas id="oyunEkrani"></canvas>
    
    <!-- GELİŞMİŞ AYARLAR MODALI -->
    <div id="gelismisAyarlarModal">
        <h3 style="color:#f39c12; margin-top:0; text-align:center;">⚙️ Gelişmiş Oyun Değişkenleri</h3>
        <div class="ayar-grid">
            <label>Top Kayganlığı (Normal):</label> <input type="number" id="ay_sur" step="0.005" value="0.975">
            <label>Buzlu Şut Kayganlığı:</label> <input type="number" id="ay_buz" step="0.005" value="0.995">
            <label>Normal Şut Hızı:</label> <input type="number" id="ay_sut" step="0.5" value="7.5">
            <label>Güçlü (Mor) Şut Hızı:</label> <input type="number" id="ay_gsut" step="0.5" value="11.5">
            <label>Mıknatıs Çekim Gücü:</label> <input type="number" id="ay_cek" step="0.05" value="0.15">
            <label>Oyuncu Yürüme İvmesi:</label> <input type="number" id="ay_hiz" step="0.05" value="0.3">
            <label>Oyuncu Koşma İvmesi:</label> <input type="number" id="ay_shiz" step="0.05" value="0.55">
            <label>İttirme/Fırlatma Gücü:</label> <input type="number" id="ay_itguc" step="1" value="15">
            <label>İttirme Bekleme Süresi (sn):</label> <input type="number" id="ay_itsur" step="1" value="10">
        </div>
        <div style="text-align:center;">
            <button onclick="ayarlariUygula()" style="background:#2ecc71; color:white; padding:8px 15px; border:none; border-radius:5px; margin:0;">Uygula</button>
            <button onclick="document.getElementById('gelismisAyarlarModal').style.display='none'" style="background:#e74c3c; color:white; padding:8px 15px; border:none; border-radius:5px; margin-left:10px;">Kapat</button>
        </div>
    </div>

    <!-- TAKIM LİSTELERİ -->
    <div id="takimMaviListe" class="takim-listesi">
        <h3 style="color:#3498db">Mavi Takım</h3>
        <ul id="listeMavi"></ul>
    </div>
    <div id="takimKirmiziListe" class="takim-listesi">
        <h3 style="color:#e74c3c">Kırmızı Takım</h3>
        <ul id="listeKirmizi"></ul>
    </div>
    <div id="takimIzleyiciListe" class="takim-listesi">
        <h3 style="color:#7f8c8d">İzleyiciler</h3>
        <ul id="listeIzleyici"></ul>
    </div>

    <div id="chatAlani">
        <ul id="mesajGecmisi"></ul>
        <input type="text" id="chatInput" placeholder="Mesaj yaz (Açmak için Enter)..." autocomplete="off">
    </div>

    <div id="uiKatmani">
        <div id="menu">
            <h1 style="font-size: 3em; margin-top: 0;">NeoPong</h1>
            <hr style="width: 400px; border-color: #444; margin: 20px auto;">
            
            <h3>Seçenek A: Merkezi Sunucu</h3>
            <button id="btnResmi">Resmi Sunucuya Katıl</button>
            <br><br><br>
            
            <h3>Seçenek B: Sıfır Ping (Özel P2P Oda)</h3>
            <input type="text" id="nickKodu" placeholder="Kullanıcı Adı">
            <input type="text" id="odaKodu" placeholder="Oda Adı Girin">
            <br>
            <button id="btnP2P">Özel Odaya Kur / Katıl</button>
        </div>

        <div id="kontrolPaneli">
            <p id="durum" style="color: yellow; margin: 0 0 10px 0; font-weight: bold;">Oyuna giriliyor...</p>
            
            <div id="takimSecim">
                <button id="btnKirmizi">Kırmızı Takıma Katıl</button>
                <button id="btnIzleyici">İzleyici (Spectator)</button>
                <button id="btnMavi">Mavi Takıma Katıl</button>
            </div>
            
            <div id="ayarlar">
                <span id="ayarIcerik">Arayüz Yükleniyor...</span>
            </div>
        </div>

        <div id="sagUstKisim">
            <div id="ustButonlar">
                <button id="btnAyarlarAc">⚙️ Ayarlar</button>
                <button id="btnMacBitir">Maçı Bitir</button>
                <button id="btnOdadanCik">Menüye Dön</button>
            </div>
        </div>

        <div id="mobilKontroller">
            <div id="joystickAlan"><div id="joystickTop"></div></div>
            <button id="btnMobilIttir">İT (E)</button>
            <button id="btnMobilSprint">HIZ</button>
            <button id="btnMobilSut">ŞUT</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const MAX_OYUNCU = 8; 
        const oracleIP = "https://sunucu.squid99.ink";
        const socket = io(oracleIP);
        
        const menuDiv = document.getElementById('menu');
        const kontrolPaneli = document.getElementById('kontrolPaneli');
        const sagUstKisim = document.getElementById('sagUstKisim');
        const durumMetni = document.getElementById('durum');
        const canvas = document.getElementById('oyunEkrani');
        const ctx = canvas.getContext('2d');

        const chatAlani = document.getElementById('chatAlani');
        const mesajGecmisi = document.getElementById('mesajGecmisi');
        const chatInput = document.getElementById('chatInput');

        let sonGelenState = null;

        // YENİ: ARAYÜZDEN DEĞİŞKENLERİ UYGULAMA
        window.ayarlariUygula = function() {
            if (!isHost) return;
            p2pState.settings.topSurtunme = parseFloat(document.getElementById('ay_sur').value);
            p2pState.settings.buzSurtunme = parseFloat(document.getElementById('ay_buz').value);
            p2pState.settings.sutGucu = parseFloat(document.getElementById('ay_sut').value);
            p2pState.settings.gucSutGucu = parseFloat(document.getElementById('ay_gsut').value);
            p2pState.settings.cekimGucu = parseFloat(document.getElementById('ay_cek').value);
            p2pState.settings.oyuncuHiz = parseFloat(document.getElementById('ay_hiz').value);
            p2pState.settings.sprintHiz = parseFloat(document.getElementById('ay_shiz').value);
            p2pState.settings.ittirmeGucu = parseFloat(document.getElementById('ay_itguc').value);
            p2pState.settings.ittirmeSure = parseFloat(document.getElementById('ay_itsur').value);
            document.getElementById('gelismisAyarlarModal').style.display='none';
            mesajEkle("SİSTEM", "Değişkenler anında güncellendi!", "#2ecc71");
        }

        document.getElementById('btnAyarlarAc').addEventListener('click', () => {
            document.getElementById('gelismisAyarlarModal').style.display = 'block';
        });

        function mesajEkle(gonderen, mesaj, renk = "#f1c40f") {
            const li = document.createElement('li');
            li.innerHTML = `<b style="color:${renk}">${gonderen}:</b> ${mesaj}`;
            mesajGecmisi.appendChild(li);
            mesajGecmisi.scrollTop = mesajGecmisi.scrollHeight; 
        }

        chatInput.addEventListener('keydown', (e) => {
            e.stopPropagation(); 
            if (e.key === 'Enter') {
                if (chatInput.value.trim() !== '') {
                    const msg = chatInput.value.trim();
                    chatInput.value = '';
                    chatInput.blur(); 

                    if (isOfficial) {
                        socket.emit('chat-mesaj', msg);
                    } else if (isHost) {
                        let myTeam = p2pState.players[socket.id] ? p2pState.players[socket.id].team : 'spectator';
                        let teamColor = myTeam === 'red' ? '#e74c3c' : (myTeam === 'blue' ? '#3498db' : '#7f8c8d');
                        mesajEkle(myNickname, msg, teamColor); 
                        const chatPaketi = JSON.stringify({ type: 'chat', gonderen: myNickname, mesaj: msg, renk: teamColor });
                        for (let id in channels) {
                            if (channels[id].readyState === 'open') channels[id].send(chatPaketi);
                        }
                    } else if (isClient && hostChannel && hostChannel.readyState === 'open') {
                        hostChannel.send(JSON.stringify({ type: 'chat-gonder', mesaj: msg }));
                    }
                } else {
                    chatInput.blur(); 
                }
            }
        });

        socket.on('chat-mesaj', (data) => {
            let gonderenRenk = "#ffffff";
            if (sonGelenState && sonGelenState.players) {
                for (let id in sonGelenState.players) {
                    if (sonGelenState.players[id].nick === data.gonderen) {
                        let takim = sonGelenState.players[id].team;
                        gonderenRenk = takim === 'red' ? '#e74c3c' : (takim === 'blue' ? '#3498db' : '#7f8c8d');
                        break;
                    }
                }
            }
            mesajEkle(data.gonderen, data.mesaj, gonderenRenk);
        });

        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        let currentPing = 0;
        setInterval(() => { 
            if (isOfficial || (!isHost && !isClient)) {
                socket.emit('pingCheck', Date.now()); 
            } else if (isClient && hostChannel && hostChannel.readyState === 'open') {
                hostChannel.send(JSON.stringify({ type: 'p2p-ping', time: Date.now() }));
            } else if (isHost) {
                currentPing = 0;
            }
        }, 1000);

        socket.on('pongCheck', (zaman) => { 
            if (isOfficial || (!isHost && !isClient)) {
                currentPing = Date.now() - zaman; 
            }
        });

        let myNickname = "Oyuncu";
        window.currentZoom = 1;
        
        let sonListeCiktisi = "";
        function listeleriGuncelle(state) {
            if (!state || !state.players) return;
            let currentData = JSON.stringify(Object.values(state.players).map(p => p.nick + p.team));
            if (currentData === sonListeCiktisi) return; 
            sonListeCiktisi = currentData;

            const lMavi = document.getElementById('listeMavi');
            const lKirmizi = document.getElementById('listeKirmizi');
            const lIzleyici = document.getElementById('listeIzleyici');
            
            lMavi.innerHTML = ''; lKirmizi.innerHTML = ''; lIzleyici.innerHTML = '';

            for (let id in state.players) {
                let p = state.players[id];
                let isMe = (id === socket.id);
                let ext = isMe ? ' (Sen)' : '';
                if (p.team === 'blue') {
                    lMavi.innerHTML += `<li>- ${p.nick}${ext}</li>`;
                } else if (p.team === 'red') {
                    lKirmizi.innerHTML += `<li>- ${p.nick}${ext}</li>`;
                } else {
                    lIzleyici.innerHTML += `<li>- ${p.nick}${ext}</li>`;
                }
            }
        }

        function cizimiGuncelle(state) {
            if (!state || !state.ball || !state.sahaW) return;
            sonGelenState = state;
            listeleriGuncelle(state); 

            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                resizeCanvas();
            }

            if (isOfficial) {
                kontrolPaneli.style.display = "none";
            } else {
                kontrolPaneli.style.display = state.isPlaying ? "none" : "block";
                if (isHost) {
                    document.getElementById('btnMacBitir').style.display = state.isPlaying ? "inline-block" : "none";
                    document.getElementById('btnAyarlarAc').style.display = state.isPlaying ? "inline-block" : "none";
                }
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = "#2c3e23";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let myP = state.players ? state.players[socket.id] : null;
            let focusX = state.ball.x;
            let focusY = state.ball.y;
            let targetZoom = 1;
            
            if (state.sahaW <= 1100) {
                focusX = state.sahaW / 2;
                focusY = state.sahaH / 2;
                let fitZoomX = canvas.width / (state.sahaW + 150);
                let fitZoomY = canvas.height / (state.sahaH + 150);
                targetZoom = Math.min(fitZoomX, fitZoomY);
            } else {
                if (myP && myP.team !== 'spectator') {
                    let dist = Math.hypot(state.ball.x - myP.x, state.ball.y - myP.y);
                    focusX = myP.x * 0.6 + state.ball.x * 0.4;
                    focusY = myP.y * 0.6 + state.ball.y * 0.4;
                    let idealZoom = (Math.min(canvas.width, canvas.height) * 0.55) / Math.max(dist, 200);
                    targetZoom = Math.max(0.4, Math.min(1.4, idealZoom));
                }
            }
            
            if (isNaN(window.currentZoom)) window.currentZoom = targetZoom;
            window.currentZoom += (targetZoom - window.currentZoom) * 0.05; 

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(window.currentZoom, window.currentZoom);
            ctx.translate(-focusX, -focusY);

            ctx.fillStyle = "#4a6b3d"; 
            ctx.fillRect(0, 0, state.sahaW, state.sahaH);
            ctx.fillStyle = "#527543"; 
            for (let i = 0; i < state.sahaW; i += 80) {
                let w = Math.min(40, state.sahaW - i);
                ctx.fillRect(i, 0, w, state.sahaH);
            }
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)"; 
            ctx.lineWidth = 8; 
            ctx.strokeRect(0, 0, state.sahaW, state.sahaH);

            ctx.beginPath(); 
            ctx.moveTo(state.sahaW / 2, 0); 
            ctx.lineTo(state.sahaW / 2, state.sahaH); 
            ctx.stroke();

            ctx.beginPath(); 
            ctx.arc(state.sahaW / 2, state.sahaH / 2, state.kaleBoyutu / 2, 0, Math.PI * 2); 
            ctx.stroke();

            let kaleUst = (state.sahaH / 2) - (state.kaleBoyutu / 2);
            let kaleAlt = (state.sahaH / 2) + (state.kaleBoyutu / 2);

            ctx.fillStyle = "rgba(231, 76, 60, 0.4)"; 
            ctx.fillRect(-45, kaleUst, 45, state.kaleBoyutu);
            ctx.strokeStyle = "rgba(231, 76, 60, 0.95)";
            ctx.lineWidth = 6;
            ctx.strokeRect(-45, kaleUst, 45, state.kaleBoyutu);
            ctx.fillStyle = "#111"; 
            ctx.beginPath(); ctx.arc(0, kaleUst, 6, 0, Math.PI * 2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(0, kaleAlt, 6, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "rgba(52, 152, 219, 0.4)"; 
            ctx.fillRect(state.sahaW, kaleUst, 45, state.kaleBoyutu);
            ctx.strokeStyle = "rgba(52, 152, 219, 0.95)";
            ctx.lineWidth = 6;
            ctx.strokeRect(state.sahaW, kaleUst, 45, state.kaleBoyutu);
            ctx.fillStyle = "#111"; 
            ctx.beginPath(); ctx.arc(state.sahaW, kaleUst, 6, 0, Math.PI * 2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(state.sahaW, kaleAlt, 6, 0, Math.PI * 2); ctx.fill();

            if (state.powerups) {
                for (let pu of state.powerups) {
                    ctx.beginPath(); 
                    ctx.arc(pu.x, pu.y, pu.radius, 0, Math.PI * 2);
                    ctx.fillStyle = pu.type === 'dash' ? '#f1c40f' : (pu.type === 'powerShot' ? '#9b59b6' : '#e67e22');
                    ctx.fill(); 
                    ctx.strokeStyle = "white"; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                    ctx.fillStyle = "white"; 
                    ctx.font = "bold 14px Arial"; 
                    ctx.textAlign = "center";
                    let pText = pu.type === 'dash' ? 'HIZ' : (pu.type === 'powerShot' ? 'ŞUT' : 'ÇEK');
                    ctx.fillText(pText, pu.x, pu.y + 5);
                }
            }

            // TOP ÇİZİMİ
            ctx.beginPath(); 
            ctx.arc(state.ball.x, state.ball.y, state.ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = (state.ball.powerShotActive && state.ball.powerShotTimer > 0) ? "#00ffff" : "white"; 
            ctx.fill(); 
            ctx.strokeStyle = "black"; 
            ctx.lineWidth = 2; 
            ctx.stroke();

            // OYUNCULARI ÇİZ
            if (state.players) {
                for (let id in state.players) {
                    let p = state.players[id];
                    if (p.team === 'spectator') continue; 
                    
                    // İTTİRME ŞOK DALGASI ANİMASYONU
                    if (p.pushAnim > 0) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius + (20 - p.pushAnim) * 5, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(52, 152, 219, ${p.pushAnim / 20})`;
                        ctx.lineWidth = 5;
                        ctx.stroke();
                    }

                    if (p.buffs) {
                        if (p.buffs.dashTimer > 0) { 
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 7, 0, Math.PI * 2); 
                            ctx.strokeStyle = "rgba(241, 196, 15, 0.8)"; ctx.lineWidth = 3; ctx.stroke(); 
                        }
                        if (p.buffs.powerShotReady) { 
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 11, 0, Math.PI * 2); 
                            ctx.strokeStyle = "rgba(155, 89, 182, 0.8)"; ctx.lineWidth = 3; ctx.stroke(); 
                        }
                        if (p.buffs.magnetTimer > 0) { 
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 15, 0, Math.PI * 2); 
                            ctx.strokeStyle = "rgba(230, 126, 34, 0.8)"; ctx.lineWidth = 3; ctx.stroke(); 
                        }
                    }

                    ctx.beginPath(); 
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = (p.team === 'red') ? "#e74c3c" : "#3498db";
                    ctx.fill();

                    if (p.inputs && (p.inputs.chargeShoot || p.inputs.shoot)) { 
                        ctx.strokeStyle = "white"; 
                        ctx.lineWidth = 4; 
                    } else if (id === socket.id) { 
                        ctx.strokeStyle = "rgba(200, 200, 200, 0.6)"; 
                        ctx.lineWidth = 2;
                    } else { 
                        ctx.strokeStyle = "black"; 
                        ctx.lineWidth = 2; 
                    }
                    ctx.stroke();
                    
                    ctx.fillStyle = "white"; 
                    ctx.font = "bold 14px Arial"; 
                    ctx.textAlign = "center"; 
                    ctx.strokeStyle = "black"; 
                    ctx.lineWidth = 2;
                    ctx.strokeText(p.nick || "Oyuncu", p.x, p.y + p.radius + 16); 
                    ctx.fillText(p.nick || "Oyuncu", p.x, p.y + p.radius + 16);

                    // STAMINA BARI
                    let st = p.stamina !== undefined ? p.stamina : 100;
                    ctx.fillStyle = "rgba(0,0,0,0.6)"; 
                    ctx.fillRect(p.x - 18, p.y + p.radius + 22, 36, 4);
                    ctx.fillStyle = st > 50 ? "#2ecc71" : (st > 20 ? "#f1c40f" : "#e74c3c");
                    ctx.fillRect(p.x - 18, p.y + p.radius + 22, (st / 100) * 36, 4);

                    // İTTİRME (E) COOLDOWN BARI
                    let pc = p.pushCooldown !== undefined ? p.pushCooldown : 0;
                    let maxPc = (state.settings ? state.settings.ittirmeSure : 10) * 60;
                    ctx.fillStyle = "rgba(0,0,0,0.6)"; 
                    ctx.fillRect(p.x - 18, p.y + p.radius + 28, 36, 4);
                    if(pc === 0) {
                        ctx.fillStyle = "#3498db"; 
                        ctx.fillRect(p.x - 18, p.y + p.radius + 28, 36, 4);
                    } else {
                        ctx.fillStyle = "#555"; 
                        ctx.fillRect(p.x - 18, p.y + p.radius + 28, (1 - (pc / maxPc)) * 36, 4);
                    }
                }
            }
            ctx.restore(); 

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = "white"; 
            ctx.font = "bold 45px Arial"; 
            ctx.textAlign = "center"; 
            ctx.strokeStyle = "black"; 
            ctx.lineWidth = 4;
            let skorMetni = `${state.score.red} - ${state.score.blue}`;
            ctx.strokeText(skorMetni, canvas.width / 2, 60); 
            ctx.fillText(skorMetni, canvas.width / 2, 60);
            
            if (state.isPlaying || state.kalanSure > 0) {
                let dk = Math.floor(state.kalanSure / 60); 
                let sn = state.kalanSure % 60;
                let sureMetni = `Süre: ${dk}:${sn < 10 ? '0' + sn : sn}`;
                ctx.font = "bold 22px Arial"; 
                ctx.strokeText(sureMetni, canvas.width / 2, 95); 
                ctx.fillText(sureMetni, canvas.width / 2, 95);
            }

            if (state.mesaj) {
                ctx.fillStyle = "white"; 
                ctx.strokeStyle = "black"; 
                ctx.lineWidth = 5; 
                ctx.font = "bold 55px Arial";
                ctx.strokeText(state.mesaj, canvas.width / 2, canvas.height / 2); 
                ctx.fillText(state.mesaj, canvas.width / 2, canvas.height / 2);
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.7)"; 
            ctx.font = "bold 16px Arial"; 
            ctx.textAlign = "left";
            ctx.fillText(`Ping: ${currentPing} ms`, 20, canvas.height - 20);
        }

        function startHostLoop() {
            if (gameLoopActif) return; 
            gameLoopActif = true; 
            arayuzuHostOlarakKur();

            setInterval(() => {
                if (p2pState.isPlaying && !oyunBeklemede) {
                    frameCount++;
                    if (frameCount >= 60) { 
                        frameCount = 0; 
                        p2pState.kalanSure--; 
                        if (p2pState.kalanSure <= 0) bitirOyun(); 
                    }
                    
                    if (p2pState.yeteneklerAcik && Math.random() < 0.002 && p2pState.powerups.length < 3) {
                        let rand = Math.random();
                        let pType = rand < 0.40 ? 'dash' : (rand < 0.75 ? 'powerShot' : 'magnet');
                        p2pState.powerups.push({ 
                            id: Math.random().toString(), 
                            x: Math.random() * (p2pState.sahaW - 100) + 50, 
                            y: Math.random() * (p2pState.sahaH - 100) + 50, 
                            type: pType, 
                            radius: 15 
                        });
                    }

                    for (let id in p2pState.players) {
                        let p = p2pState.players[id]; 
                        if (p.team === 'spectator') continue; 
                        if (typeof p.stamina === 'undefined') { p.stamina = 100; p.staminaCooldown = 0; p.hasShot = false; p.pushCooldown = 0; p.pushAnim = 0; }
                        if (p.buffs && p.buffs.dashTimer > 0) p.buffs.dashTimer--;
                        
                        // İTTİRME SİSTEMİ (E TUŞU)
                        if (p.inputs.push && p.pushCooldown <= 0) {
                            p.pushCooldown = p2pState.settings.ittirmeSure * 60;
                            p.pushAnim = 20; // 20 frame animasyon süresi
                            
                            for (let oId in p2pState.players) {
                                if (oId !== id && p2pState.players[oId].team !== 'spectator') {
                                    let op = p2pState.players[oId];
                                    let dx = op.x - p.x; let dy = op.y - p.y;
                                    let dist = Math.hypot(dx, dy);
                                    if (dist < p.radius * 6) { // Çarpan 6
                                        let angle = Math.atan2(dy, dx);
                                        op.vx += Math.cos(angle) * p2pState.settings.ittirmeGucu;
                                        op.vy += Math.sin(angle) * p2pState.settings.ittirmeGucu;
                                    }
                                }
                            }
                            // Topu hafif sarsma
                            let bdx = p2pState.ball.x - p.x; let bdy = p2pState.ball.y - p.y;
                            let bDist = Math.hypot(bdx, bdy);
                            if (bDist < p.radius * 6) {
                                let angle = Math.atan2(bdy, bdx);
                                p2pState.ball.vx += Math.cos(angle) * (p2pState.settings.ittirmeGucu * 0.7);
                                p2pState.ball.vy += Math.sin(angle) * (p2pState.settings.ittirmeGucu * 0.7);
                            }
                        }
                        if (p.pushCooldown > 0) p.pushCooldown--;
                        if (p.pushAnim > 0) p.pushAnim--;

                        // OYUNCU HAREKETLERİ (Değişkenler ayar panelinden çekiliyor)
                        let ivme = p2pState.settings.oyuncuHiz; 
                        if (p.inputs.sprint && p.stamina > 0) { 
                            ivme = p2pState.settings.sprintHiz; 
                            p.stamina -= 1.5; 
                            if (p.stamina < 0) p.stamina = 0; 
                            p.staminaCooldown = 180; 
                        } else {
                            if (p.staminaCooldown > 0) p.staminaCooldown--;
                            else if (p.stamina < 100) p.stamina += 0.5;
                        }
                        if (p.buffs && p.buffs.dashTimer > 0) ivme *= 1.8;
                        
                        if (p.inputs.up) p.vy -= ivme; 
                        if (p.inputs.down) p.vy += ivme; 
                        if (p.inputs.left) p.vx -= ivme; 
                        if (p.inputs.right) p.vx += ivme;
                        p.vx *= 0.9; p.vy *= 0.9; 
                        p.x += p.vx; p.y += p.vy;
                        
                        let pad = 200; 
                        if (p.x < -pad) p.x = -pad; 
                        if (p.x > p2pState.sahaW + pad) p.x = p2pState.sahaW + pad; 
                        if (p.y < -pad) p.y = -pad; 
                        if (p.y > p2pState.sahaH + pad) p.y = p2pState.sahaH + pad;
                        
                        for (let i = p2pState.powerups.length - 1; i >= 0; i--) {
                            let pu = p2pState.powerups[i]; 
                            let puDist = Math.hypot(pu.x - p.x, pu.y - p.y);
                            if (puDist < p.radius + pu.radius) {
                                if (!p.buffs) p.buffs = { dashTimer: 0, powerShotReady: false, magnetTimer: 0 };
                                if (pu.type === 'dash') p.buffs.dashTimer = 300; 
                                if (pu.type === 'powerShot') p.buffs.powerShotReady = true;
                                if (pu.type === 'magnet') p.buffs.magnetTimer = 90; 
                                p2pState.powerups.splice(i, 1);
                            }
                        }

                        if (p.buffs && p.buffs.magnetTimer > 0) {
                            p.buffs.magnetTimer--;
                            let mDx = p.x - p2pState.ball.x;
                            let mDy = p.y - p2pState.ball.y;
                            let mDist = Math.hypot(mDx, mDy);
                            if (mDist > 0) {
                                p2pState.ball.vx += (mDx / mDist) * p2pState.settings.cekimGucu;
                                p2pState.ball.vy += (mDy / mDist) * p2pState.settings.cekimGucu;
                            }
                        }

                        if (!p.inputs.chargeShoot) p.hasShot = false;

                        let dx = p2pState.ball.x - p.x; 
                        let dy = p2pState.ball.y - p.y; 
                        let mesafe = Math.sqrt(dx * dx + dy * dy); 
                        let temasMesafesi = p.radius + p2pState.ball.radius; 
                        
                        if (mesafe < temasMesafesi) {
                            if (p2pState.ball.powerShotActive && p2pState.ball.powerShotTimer < 290) {
                                p2pState.ball.powerShotActive = false;
                            }

                            let overlap = temasMesafesi - mesafe; 
                            let nx = dx / (mesafe || 1); 
                            let ny = dy / (mesafe || 1);
                            
                            p2pState.ball.x += nx * (overlap * 0.7); 
                            p2pState.ball.y += ny * (overlap * 0.7); 
                            p.x -= nx * (overlap * 0.3);
                            p.y -= ny * (overlap * 0.3);

                            p2pState.ball.vx += nx * 0.5; 
                            p2pState.ball.vy += ny * 0.5;

                            let bSpeed = Math.hypot(p2pState.ball.vx, p2pState.ball.vy);
                            let pSpeed = Math.hypot(p.vx, p.vy);
                            let maxDribbleSpeed = Math.max(pSpeed + 1.5, 3.0);
                            
                            if (!p.hasShot && bSpeed > maxDribbleSpeed) {
                                p2pState.ball.vx = (p2pState.ball.vx / bSpeed) * maxDribbleSpeed;
                                p2pState.ball.vy = (p2pState.ball.vy / bSpeed) * maxDribbleSpeed;
                            }
                        }

                        // ŞUT (Değişkenler ayar panelinden çekiliyor)
                        if (p.inputs.chargeShoot && !p.hasShot && mesafe <= temasMesafesi + 6) {
                            let aci = Math.atan2(dy, dx); 
                            let vurusHizi = p2pState.settings.sutGucu; 
                            if (p.buffs && p.buffs.powerShotReady) { 
                                vurusHizi = p2pState.settings.gucSutGucu; 
                                p.buffs.powerShotReady = false; 
                                p2pState.ball.powerShotActive = true;
                                p2pState.ball.powerShotTimer = 300; 
                            }
                            p2pState.ball.vx = Math.cos(aci) * vurusHizi; 
                            p2pState.ball.vy = Math.sin(aci) * vurusHizi;
                            p.hasShot = true;
                        }
                    }

                    let pIds = Object.keys(p2pState.players).filter(id => p2pState.players[id].team !== 'spectator');
                    for (let k = 0; k < 2; k++) { 
                        for (let i = 0; i < pIds.length; i++) {
                            for (let j = i + 1; j < pIds.length; j++) {
                                let p1 = p2pState.players[pIds[i]]; 
                                let p2 = p2pState.players[pIds[j]];
                                let dx = p2.x - p1.x; 
                                let dy = p2.y - p1.y; 
                                let mesafe = Math.sqrt(dx * dx + dy * dy); 
                                let temas = p1.radius + p2.radius;
                                if (mesafe < temas && mesafe > 0) {
                                    let overlap = temas - mesafe; 
                                    let nx = dx / mesafe; 
                                    let ny = dy / mesafe;
                                    p1.x -= nx * (overlap / 2); 
                                    p1.y -= ny * (overlap / 2); 
                                    p2.x += nx * (overlap / 2); 
                                    p2.y += ny * (overlap / 2);
                                }
                            }
                        }
                    }

                    p2pState.ball.x += p2pState.ball.vx; 
                    p2pState.ball.y += p2pState.ball.vy; 
                    
                    if (p2pState.ball.powerShotActive && p2pState.ball.powerShotTimer > 0) {
                        p2pState.ball.powerShotTimer--;
                        p2pState.ball.vx *= p2pState.settings.buzSurtunme; 
                        p2pState.ball.vy *= p2pState.settings.buzSurtunme;
                        if (p2pState.ball.powerShotTimer <= 0) p2pState.ball.powerShotActive = false;
                    } else {
                        p2pState.ball.vx *= p2pState.settings.topSurtunme; 
                        p2pState.ball.vy *= p2pState.settings.topSurtunme;
                    }

                    if (Math.abs(p2pState.ball.vx) < 0.05) p2pState.ball.vx = 0;
                    if (Math.abs(p2pState.ball.vy) < 0.05) p2pState.ball.vy = 0;

                    let kaleUst = (p2pState.sahaH / 2) - (p2pState.kaleBoyutu / 2); 
                    let kaleAlt = (p2pState.sahaH / 2) + (p2pState.kaleBoyutu / 2);

                    let direkler = [
                        { x: 0, y: kaleUst, r: 6 },
                        { x: 0, y: kaleAlt, r: 6 },
                        { x: p2pState.sahaW, y: kaleUst, r: 6 },
                        { x: p2pState.sahaW, y: kaleAlt, r: 6 }
                    ];
                    for (let direk of direkler) {
                        let dx = p2pState.ball.x - direk.x;
                        let dy = p2pState.ball.y - direk.y;
                        let mesafe = Math.sqrt(dx * dx + dy * dy);
                        let temas = p2pState.ball.radius + direk.r;
                        if (mesafe < temas) {
                            let overlap = temas - mesafe;
                            let nx = dx / mesafe;
                            let ny = dy / mesafe;
                            p2pState.ball.x += nx * overlap;
                            p2pState.ball.y += ny * overlap;
                            let dotProduct = p2pState.ball.vx * nx + p2pState.ball.vy * ny;
                            p2pState.ball.vx -= 2 * dotProduct * nx;
                            p2pState.ball.vy -= 2 * dotProduct * ny;
                            p2pState.ball.vx *= 0.8; 
                            p2pState.ball.vy *= 0.8;
                        }
                    }

                    if (p2pState.ball.y < p2pState.ball.radius) { 
                        p2pState.ball.vy *= -1; 
                        p2pState.ball.y = p2pState.ball.radius; 
                    }
                    if (p2pState.ball.y > p2pState.sahaH - p2pState.ball.radius) { 
                        p2pState.ball.vy *= -1; 
                        p2pState.ball.y = p2pState.sahaH - p2pState.ball.radius; 
                    }
                    
                    if (p2pState.ball.y > kaleUst && p2pState.ball.y < kaleAlt) {
                        let kaleDerinlik = 42; 
                        
                        if (p2pState.ball.x < 0) {
                            if (p2pState.ball.x < -kaleDerinlik + p2pState.ball.radius) {
                                p2pState.ball.x = -kaleDerinlik + p2pState.ball.radius;
                                p2pState.ball.vx *= -0.2; 
                            }
                            if (p2pState.ball.y < kaleUst + p2pState.ball.radius) {
                                p2pState.ball.y = kaleUst + p2pState.ball.radius;
                                p2pState.ball.vy *= -0.2;
                            }
                            if (p2pState.ball.y > kaleAlt - p2pState.ball.radius) {
                                p2pState.ball.y = kaleAlt - p2pState.ball.radius;
                                p2pState.ball.vy *= -0.2;
                            }
                            
                            if (p2pState.ball.x < -p2pState.ball.radius && !oyunBeklemede) {
                                p2pState.score.blue++; 
                                p2pState.mesaj = "MAVİ TAKIM GOL ATTI!"; 
                                oyunBeklemede = true;
                                setTimeout(() => { 
                                    if(p2pState.score.blue >= p2pState.skorSiniri) bitirOyun(); 
                                    else { santraYap(); oyunBeklemede = false; p2pState.mesaj = ""; } 
                                }, 3000);
                            }
                        } else if (p2pState.ball.x > p2pState.sahaW) {
                            if (p2pState.ball.x > p2pState.sahaW + kaleDerinlik - p2pState.ball.radius) {
                                p2pState.ball.x = p2pState.sahaW + kaleDerinlik - p2pState.ball.radius;
                                p2pState.ball.vx *= -0.2;
                            }
                            if (p2pState.ball.y < kaleUst + p2pState.ball.radius) {
                                p2pState.ball.y = kaleUst + p2pState.ball.radius;
                                p2pState.ball.vy *= -0.2;
                            }
                            if (p2pState.ball.y > kaleAlt - p2pState.ball.radius) {
                                p2pState.ball.y = kaleAlt - p2pState.ball.radius;
                                p2pState.ball.vy *= -0.2;
                            }

                            if (p2pState.ball.x > p2pState.sahaW + p2pState.ball.radius && !oyunBeklemede) {
                                p2pState.score.red++; 
                                p2pState.mesaj = "KIRMIZI TAKIM GOL ATTI!"; 
                                oyunBeklemede = true;
                                setTimeout(() => { 
                                    if(p2pState.score.red >= p2pState.skorSiniri) bitirOyun(); 
                                    else { santraYap(); oyunBeklemede = false; p2pState.mesaj = ""; } 
                                }, 3000);
                            }
                        }
                    } else {
                        if (p2pState.ball.x < p2pState.ball.radius) { 
                            p2pState.ball.vx *= -1; 
                            p2pState.ball.x = p2pState.ball.radius; 
                        }
                        if (p2pState.ball.x > p2pState.sahaW - p2pState.ball.radius) { 
                            p2pState.ball.vx *= -1; 
                            p2pState.ball.x = p2pState.sahaW - p2pState.ball.radius; 
                        }
                    }
                } else if (!p2pState.isPlaying) {
                    for (let id in p2pState.players) {
                        let p = p2pState.players[id]; 
                        if (p.team !== 'spectator') {
                            if (typeof p.stamina === 'undefined') { p.stamina = 100; p.staminaCooldown = 0; p.hasShot = false; p.pushCooldown = 0; p.pushAnim = 0; }
                            let ivme = p2pState.settings.oyuncuHiz; 
                            if (p.inputs.sprint && p.stamina > 0) { 
                                ivme = p2pState.settings.sprintHiz; 
                                p.stamina -= 1.5; if (p.stamina < 0) p.stamina = 0; 
                                p.staminaCooldown = 180; 
                            } else { 
                                if (p.staminaCooldown > 0) p.staminaCooldown--; 
                                else if (p.stamina < 100) p.stamina += 0.5; 
                            }
                            
                            if (p.inputs.up) p.vy -= ivme; 
                            if (p.inputs.down) p.vy += ivme; 
                            if (p.inputs.left) p.vx -= ivme; 
                            if (p.inputs.right) p.vx += ivme;
                            p.vx *= 0.9; p.vy *= 0.9; 
                            p.x += p.vx; p.y += p.vy;
                        }
                    }
                }
                sonGelenState = p2pState;
                const statePaketi = JSON.stringify({ type: 'state', data: p2pState });
                for (let id in channels) { 
                    if (channels[id].readyState === 'open') channels[id].send(statePaketi); 
                }
            }, 1000 / 60);
        }

        socket.on('user-connected', async (yeniOyuncuId) => {
            if (!isHost) return; 
            if (Object.keys(p2pState.players).length >= MAX_OYUNCU) return; 
            
            p2pState.players[yeniOyuncuId] = { 
                x: -1000, y: -1000, vx: 0, vy: 0, radius: 16, 
                team: 'spectator', nick: "Bağlanıyor...", 
                inputs: { up:false, down:false, left:false, right:false, chargeShoot:false, sprint:false, push:false }, 
                buffs: { dashTimer: 0, powerShotReady: false, magnetTimer: 0 }, 
                stamina: 100, staminaCooldown: 0, hasShot: false, pushCooldown: 0, pushAnim: 0
            };

            const pc = new RTCPeerConnection(rtcConfig); 
            peers[yeniOyuncuId] = pc; 
            iceKuyruklari[yeniOyuncuId] = [];
            const dc = pc.createDataChannel("oyunTuneli"); 
            channels[yeniOyuncuId] = dc; 
            veriKanaliniAyarla(dc, yeniOyuncuId);

            pc.onicecandidate = event => { 
                if (event.candidate) socket.emit('signal', { to: yeniOyuncuId, signal: { type: 'ice', candidate: event.candidate } }); 
            };
            const offer = await pc.createOffer(); 
            await pc.setLocalDescription(offer);
            socket.emit('signal', { to: yeniOyuncuId, signal: { type: 'offer', sdp: pc.localDescription } });
        });

        socket.on('user-disconnected', (kopanId) => {
            if (peers[kopanId]) { peers[kopanId].close(); delete peers[kopanId]; }
            if (channels[kopanId]) { channels[kopanId].close(); delete channels[kopanId]; }
            if (isHost && p2pState.players[kopanId]) { delete p2pState.players[kopanId]; }
        });

        socket.on('signal', async (data) => {
            const senderId = data.from;
            if (isHost) {
                const pc = peers[senderId]; 
                if (!pc) return;
                try {
                    if (data.signal.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                        while (iceKuyruklari[senderId].length > 0) await pc.addIceCandidate(iceKuyruklari[senderId].shift());
                    } else if (data.signal.type === 'ice') {
                        if (pc.remoteDescription) await pc.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                        else iceKuyruklari[senderId].push(new RTCIceCandidate(data.signal.candidate));
                    }
                } catch (hata) {} 
                return;
            }

            if (!hostConnection) {
                hostConnection = new RTCPeerConnection(rtcConfig);
                hostConnection.ondatachannel = event => { 
                    hostChannel = event.channel; 
                    veriKanaliniAyarla(hostChannel, "HOST"); 
                };
                hostConnection.onicecandidate = event => { 
                    if (event.candidate) socket.emit('signal', { to: senderId, signal: { type: 'ice', candidate: event.candidate } }); 
                };
            }
            try {
                if (data.signal.type === 'offer') {
                    await hostConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                    const answer = await hostConnection.createAnswer(); 
                    await hostConnection.setLocalDescription(answer);
                    socket.emit('signal', { to: senderId, signal: { type: 'answer', sdp: hostConnection.localDescription } });
                    while (clientIceKuyrugu.length > 0) await hostConnection.addIceCandidate(clientIceKuyrugu.shift());
                } else if (data.signal.type === 'ice') {
                    if (hostConnection.remoteDescription) await hostConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                    else clientIceKuyrugu.push(new RTCIceCandidate(data.signal.candidate));
                }
            } catch (hata) {}
        });

        function veriKanaliniAyarla(channel, kimlik) {
            const baglantiBasariliYap = () => { 
                if (!isHost) channel.send(JSON.stringify({ type: 'set-nick', nick: myNickname })); 
            };
            if (channel.readyState === 'open') baglantiBasariliYap(); 
            channel.onopen = () => baglantiBasariliYap();
            channel.onmessage = (event) => {
                const mesaj = JSON.parse(event.data);
                if (isHost) {
                    if (mesaj.type === 'input' && p2pState.players[kimlik]) {
                        p2pState.players[kimlik].inputs = mesaj.data;
                    } else if (mesaj.type === 'set-nick' && p2pState.players[kimlik]) {
                        p2pState.players[kimlik].nick = mesaj.nick;
                    } else if (mesaj.type === 'team-change' && p2pState.players[kimlik] && !p2pState.isPlaying) {
                        p2pState.players[kimlik].team = mesaj.team; 
                        pozisyonSifirla(kimlik);
                    } else if (mesaj.type === 'p2p-ping') {
                        channel.send(JSON.stringify({ type: 'p2p-pong', time: mesaj.time }));
                    } else if (mesaj.type === 'chat-gonder') {
                        let sender = p2pState.players[kimlik];
                        let gonderenNick = sender ? sender.nick : "Oyuncu";
                        let gonderenTakim = sender ? sender.team : "spectator";
                        let teamColor = gonderenTakim === 'red' ? '#e74c3c' : (gonderenTakim === 'blue' ? '#3498db' : '#7f8c8d');
                        
                        mesajEkle(gonderenNick, mesaj.mesaj, teamColor);
                        const chatPaketi = JSON.stringify({ type: 'chat', gonderen: gonderenNick, mesaj: mesaj.mesaj, renk: teamColor });
                        for (let id in channels) {
                            if (channels[id].readyState === 'open') channels[id].send(chatPaketi);
                        }
                    }
                } else if (!isHost) { 
                    if (mesaj.type === 'state') {
                        sonGelenState = mesaj.data;
                    } else if (mesaj.type === 'p2p-pong') {
                        currentPing = Date.now() - mesaj.time;
                    } else if (mesaj.type === 'chat') {
                        mesajEkle(mesaj.gonderen, mesaj.mesaj, mesaj.renk);
                    }
                }
            };
        }
    </script>
