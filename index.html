<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NeoPong - Ana Menü</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        canvas { background-color: #718c5a; border: 2px solid #fff; margin-top: 20px; }
        #menu { margin-top: 100px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; }
        #btnResmi { background-color: #3498db; color: white; }
        #btnP2P { background-color: #2ecc71; color: white; }
        input { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; border: none; text-align: center; }
    </style>
</head>
<body>
    <!-- 1. GİRİŞ MENÜSÜ -->
    <div id="menu">
        <h1 style="font-size: 3em;">NeoPong</h1>
        <p style="color: #aaa;">Sunucu Gecikmesi (Ping): <span id="pingYazisi" style="color: white; font-weight: bold;">Ölçülüyor...</span></p>
        
        <hr style="width: 400px; border-color: #444; margin: 30px auto;">
        
        <h3>Seçenek A: Merkezi Sunucu</h3>
        <p style="font-size: 0.9em; color: #ccc;">Oracle bulut sunucusu üzerinden oynanır. Herkese açıktır.</p>
        <button id="btnResmi">Resmi Sunucuya Katıl</button>
        
        <br><br><br>
        
        <h3>Seçenek B:Özel P2P Oda</h3>
        <p style="font-size: 0.9em; color: #ccc;">Sadece aynı ağdaki oyuncular içindir. </p>
        <input type="text" id="odaKodu" placeholder="Oda Adı Girin">
        <br>
        <button id="btnP2P">Özel Odaya Kur / Katıl</button>
    </div>

    <!-- 2. OYUN EKRANI (Başlangıçta Gizlidir) -->
    <div id="oyunAlani" style="display: none;">
        <h1>NeoPong</h1>
        <p id="durum">Oyuna giriliyor...</p>
        <canvas id="oyunEkrani" width="800" height="400"></canvas>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
       // ORACLE SUNUCUSUNA BAĞLANTI (Santral ve Resmi Sunucu)
        const oracleIP = "http://132.226.192.255:3000";
        const socket = io(oracleIP);
        
        // Arayüz Değişkenleri
        const menuDiv = document.getElementById('menu');
        const oyunAlaniDiv = document.getElementById('oyunAlani');
        const pingYazisi = document.getElementById('pingYazisi');
        const durumMetni = document.getElementById('durum');
        const canvas = document.getElementById('oyunEkrani');
        const ctx = canvas.getContext('2d');

        // Ping Ölçümü
        setInterval(() => { socket.emit('pingCheck', Date.now()); }, 1000);
        socket.on('pongCheck', (zaman) => {
            pingYazisi.innerText = (Date.now() - zaman) + " ms";
        });

        // Tuş Dinleme Fonksiyonu
        const inputs = { up: false, down: false, left: false, right: false };
        function klavyeDinle() {
            window.addEventListener('keydown', (e) => {
                if (['w', 'ArrowUp'].includes(e.key)) inputs.up = true;
                if (['s', 'ArrowDown'].includes(e.key)) inputs.down = true;
                if (['a', 'ArrowLeft'].includes(e.key)) inputs.left = true;
                if (['d', 'ArrowRight'].includes(e.key)) inputs.right = true;
                if (isOfficial) socket.emit('input', inputs);
            });
            window.addEventListener('keyup', (e) => {
                if (['w', 'ArrowUp'].includes(e.key)) inputs.up = false;
                if (['s', 'ArrowDown'].includes(e.key)) inputs.down = false;
                if (['a', 'ArrowLeft'].includes(e.key)) inputs.left = false;
                if (['d', 'ArrowRight'].includes(e.key)) inputs.right = false;
                if (isOfficial) socket.emit('input', inputs);
            });
        }
        klavyeDinle();

        let isOfficial = false;

        // ---------------------------------------------------------
        // SEÇENEK A: RESMİ SUNUCU (ORACLE)
        // ---------------------------------------------------------
        document.getElementById('btnResmi').addEventListener('click', () => {
            isOfficial = true;
            menuDiv.style.display = "none";
            oyunAlaniDiv.style.display = "block";
            durumMetni.innerText = "Resmi Sunucuya Bağlanıldı!";
            durumMetni.style.color = "lightgreen";
            
            socket.emit('join-official'); 

            socket.on('oyunDurumu', (state) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.arc(state.ball.x, state.ball.y, state.ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = "white"; ctx.fill(); ctx.stroke();

                for (let id in state.players) {
                    let p = state.players[id];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = (id === socket.id) ? "#3498db" : "#e74c3c";
                    ctx.fill(); ctx.stroke();
                }
            });
        });

        // ---------------------------------------------------------
        // SEÇENEK B: WEBRTC (P2P SIFIR PING) ALTYAPISI
        // ---------------------------------------------------------
        let isHost = false;
        let peerConnection;
        let dataChannel; // Oyun verilerinin akacağı şifreli tünel

        // Google'ın ücretsiz STUN sunucusu (Cihazların yerel IP'lerini bulmasını sağlar)
        const rtcConfig = { 'iceServers': [{'urls': 'stun:stun.l.google.com:19302'}] };

        document.getElementById('btnP2P').addEventListener('click', () => {
            const oda = document.getElementById('odaKodu').value;
            if(!oda) return alert("Lütfen bir oda adı girin!");
            
            isOfficial = false;
            menuDiv.style.display = "none";
            oyunAlaniDiv.style.display = "block";
            durumMetni.innerText = "Oda bekleniyor... Diğer oyuncunun girmesi bekleniyor.";
            durumMetni.style.color = "yellow";
            
            socket.emit('join-p2p', oda); 
        });

        // 1. Odaya yeni biri girdiğinde (Sadece içeride bekleyen Kurucuya/Host'a gider)
        socket.on('user-connected', async (yeniOyuncuId) => {
            isHost = true; // İçeride olan kişi otomatik Host olur
            durumMetni.innerText = "Oyuncu bağlandı! P2P tüneli kuruluyor...";
            
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // Host, veri kanalını oluşturur
            dataChannel = peerConnection.createDataChannel("oyunTuneli");
            veriKanaliniAyarla(dataChannel);

            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit('signal', { to: yeniOyuncuId, signal: { type: 'ice', candidate: event.candidate } });
            };

            // Host teklif (Offer) hazırlar
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { to: yeniOyuncuId, signal: { type: 'offer', sdp: peerConnection.localDescription } });
        });

        // 2. Oracle'dan şifreli P2P sinyali geldiğinde (Her iki taraf da bunu dinler)
        socket.on('signal', async (data) => {
            if (!peerConnection) {
                // Eğer bağlantısı yoksa, bu kişi sonradan gelen İstemcidir (Client)
                peerConnection = new RTCPeerConnection(rtcConfig);
                
                peerConnection.ondatachannel = event => {
                    dataChannel = event.channel;
                    veriKanaliniAyarla(dataChannel);
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) socket.emit('signal', { to: data.from, signal: { type: 'ice', candidate: event.candidate } });
                };
            }

            if (data.signal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('signal', { to: data.from, signal: { type: 'answer', sdp: peerConnection.localDescription } });
            } else if (data.signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
            } else if (data.signal.type === 'ice') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        // 3. WebRTC Tüneli Başarıyla Açıldığında Çalışır
        function veriKanaliniAyarla(channel) {
            channel.onopen = () => {
                durumMetni.innerText = "P2P BAĞLANTISI BAŞARILI! (WebRTC aktif)";
                durumMetni.style.color = "cyan";
                
                if(isHost) {
                    console.log("Ben HOST'um. Fizikleri ben hesaplayacağım.");
                } else {
                    console.log("Ben CLIENT'ım. Sadece tuşlarımı göndereceğim.");
                }
            };

            channel.onmessage = (event) => {
                // Şifreli tünelden veri (koordinat veya tuş) geldiğinde burası çalışacak
                const veri = JSON.parse(event.data);
                console.log("Tünelden veri geldi:", veri);
            };
        }
    </script>
</body>
</html>
